<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ajman Land Rent Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --pine:#0B4A45;--pine2:#083633;--pine-soft:#13615A;--teal:#2E8B81;
  --gold:#C2982F;--gold2:#A87D1E;--gold-soft:#F1E5C2;
  --ink:#10201E;--ink2:#33433F;--muted:#6A7A76;--faint:#97A4A0;
  --bg:#EDF1EF;--card:#FFFFFF;--line:#E5EBE8;--line2:#F0F4F2;--tint:#E9F1EE;
  --up:#1C8C5A;--down:#C84B3C;--r:18px;
  --sh-sm:0 1px 2px rgba(11,74,69,.06);--sh-md:0 2px 8px rgba(11,74,69,.06),0 12px 28px -16px rgba(11,74,69,.22);--sh-lg:0 8px 40px -12px rgba(11,74,69,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num{font-family:"Tajawal",sans-serif;font-feature-settings:"tnum";unicode-bidi:plaintext}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#CBD6D2;border-radius:9px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--pine),var(--pine2));color:#cfe3df;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;overflow:hidden}
.sidebar::after{content:"";position:absolute;inset-block:-30px;inset-inline-end:-50px;width:200px;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1.3px,transparent 0);background-size:16px 16px;transform:skewX(-10deg);pointer-events:none}
.s-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;position:relative;z-index:1}
.s-logo{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(150deg,#1A6A62,#083633);display:grid;place-items:center;border:1px solid rgba(194,152,47,.4)}
.s-logo svg{width:22px;height:22px}
.s-brand h1{font-family:"Tajawal";font-size:.98rem;font-weight:800;color:#fff;line-height:1.25}
.s-brand p{font-size:.68rem;color:#8FB3AD;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1;margin-top:6px}
.nav-label{font-size:.66rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#6E9690;padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;color:#B6CFC9;font-weight:600;font-size:.9rem;transition:.18s;position:relative;width:100%;text-align:start}
.nav-item svg{width:19px;height:19px;flex:none;stroke-width:2}
.nav-item:hover{background:rgba(255,255,255,.06);color:#EAF4F1}
.nav-item.active{background:linear-gradient(100deg,rgba(194,152,47,.22),rgba(194,152,47,.06));color:#fff}
.nav-item.active svg{color:var(--gold)}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--gold);border-radius:0 3px 3px 0}
html[dir=rtl] .nav-item.active::before{border-radius:3px 0 0 3px}
.s-foot{margin-top:auto;position:relative;z-index:1;padding-top:16px}
.s-internal{display:flex;align-items:center;gap:9px;background:rgba(194,152,47,.14);border:1px solid rgba(194,152,47,.32);border-radius:12px;padding:11px 13px;font-size:.74rem;font-weight:600;color:#F0DCAE}
.s-internal .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(194,152,47,.25)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px clamp(16px,3vw,32px);display:flex;align-items:center;gap:16px}
.view-title{font-family:"Tajawal";font-weight:800;font-size:1.15rem;white-space:nowrap}
.search{flex:1;max-width:360px;position:relative;margin-inline-start:6px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;border:1px solid var(--line);background:#F6F9F8;border-radius:11px;padding:10px 40px;font-family:inherit;font-size:.88rem;color:var(--ink);transition:.15s}
.search input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(46,139,129,.13)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.lang-switch{display:inline-flex;background:#EDF2F0;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang-switch button{font-family:"Tajawal";font-size:.76rem;font-weight:700;color:var(--muted);padding:6px 13px;border-radius:999px;transition:.15s}
.lang-switch button.active{background:var(--pine);color:#fff}
.user{display:flex;align-items:center;gap:10px}
.user .ut{text-align:end;line-height:1.2}
.user .un{font-size:.82rem;font-weight:700}.user .ur{font-size:.7rem;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,var(--pine-soft),var(--pine2));color:#CFE6E1;font-family:"Tajawal";font-weight:800;font-size:.82rem;border:2px solid #fff;box-shadow:var(--sh-sm)}
.content{padding:clamp(16px,3vw,30px);max-width:1320px;width:100%;margin:0 auto}
.filterbar{display:flex;align-items:flex-end;gap:13px;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:180px}
.field label{font-size:.72rem;font-weight:700;color:var(--muted);padding-inline-start:2px}
.sel{position:relative}
select{appearance:none;width:100%;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 40px 11px 15px;cursor:pointer;box-shadow:var(--sh-sm)}
html[dir=rtl] select{padding:11px 15px 11px 40px}
select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,139,129,.13)}
.sel::after{content:"";position:absolute;inset-inline-end:15px;top:50%;width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(-45deg);pointer-events:none}
html[dir=rtl] .sel::after{border-inline-start:none;border-inline-end:2px solid var(--muted);transform:translateY(-65%) rotate(45deg)}
.btn{font-family:"Tajawal";font-weight:700;font-size:.9rem;color:#fff;background:linear-gradient(150deg,var(--pine-soft),var(--pine2));border-radius:11px;padding:11px 22px;box-shadow:0 6px 16px -7px rgba(11,74,69,.6);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--pine);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.btn svg{width:16px;height:16px}
.view{display:none;animation:fade .45s cubic-bezier(.16,1,.3,1)}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-md)}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1.6fr 1fr}
.sec-h{font-family:"Tajawal";font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:9px;margin-bottom:3px}
.sec-s{font-size:.78rem;color:var(--muted);margin-bottom:16px}
.ic{width:18px;height:18px;color:var(--pine);stroke-width:2}
.hero{padding:26px clamp(18px,2.6vw,32px);margin-bottom:16px;background:linear-gradient(135deg,var(--pine),#0E5A53 58%,#13615A);color:#EAF3F1;border:none;position:relative;overflow:hidden;box-shadow:0 22px 55px -26px rgba(11,74,69,.7)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(680px 320px at 88% -30%,rgba(194,152,47,.26),transparent 62%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 8% 135%,rgba(46,139,129,.45),transparent 60%);pointer-events:none}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:36px}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:1.4px;color:var(--gold2);text-transform:uppercase;margin-bottom:5px}
.hero .eyebrow{color:#E7C766}
.hero-top h2{font-family:"Tajawal";font-size:1.4rem;font-weight:900;color:#fff}
.hero-rt{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.basis{font-size:.78rem;color:#CDE5E0;background:rgba(255,255,255,.12);padding:7px 13px;border-radius:10px;font-weight:600;border:1px solid rgba(255,255,255,.14)}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-chip{font-size:.74rem;font-weight:700;color:#F4E6BE;background:rgba(194,152,47,.18);border:1px solid rgba(194,152,47,.34);border-radius:9px;padding:6px 11px}
.hero-chip b{font-family:"Tajawal";color:#fff}
.range{position:relative;margin:0 14px}
.track{height:16px;border-radius:999px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 2px 6px rgba(0,0,0,.18)}
.cap{position:absolute;top:50%;width:3px;height:30px;background:rgba(255,255,255,.5);transform:translateY(-50%);border-radius:3px}
.cap.low{inset-inline-start:0}.cap.high{inset-inline-end:0}
.avgm{position:absolute;top:50%;width:0;height:0;transition:inset-inline-start .7s cubic-bezier(.16,1,.3,1)}
.avgm .d{position:absolute;top:0;left:0;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--gold);border:4px solid #fff;box-shadow:0 3px 14px rgba(0,0,0,.4),0 0 0 6px rgba(194,152,47,.22)}
.avgm .f{position:absolute;bottom:22px;left:0;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--pine);font-size:.74rem;font-weight:800;padding:5px 12px;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.avgm .f::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:#fff}
.rlabels{display:flex;justify-content:space-between;margin-top:18px}
.rl .k{font-size:.72rem;color:#A9CFC9;font-weight:600}
.rl .v{font-family:"Tajawal";font-weight:900;font-size:1.55rem;display:block;margin-top:2px;color:#fff}
.rl.hi{text-align:end}
.rl .cur{color:#BFDDD7}
.cur{font-size:.7rem;font-weight:700;color:var(--muted);margin-inline-start:4px}
.kpi{padding:18px;position:relative;overflow:hidden;transition:.2s;border-radius:16px}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.kpi .kl{font-size:.76rem;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.kpi .kl svg{width:16px;height:16px;color:var(--teal);background:var(--tint);padding:7px;border-radius:9px;box-sizing:content-box;flex:none}
.kpi.gold .kl svg{color:var(--gold2);background:#F7EFD7}
.kpi .kv{font-family:"Tajawal";font-weight:900;font-size:1.9rem;line-height:1;color:var(--ink)}
.kpi.gold .kv{color:var(--gold2)}
.kpi .kf{font-size:.73rem;color:var(--faint);margin-top:10px}
.trend{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-family:"Tajawal"}
.trend.up{color:var(--up)}.trend.down{color:var(--down)}
.trend svg{width:15px;height:15px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:24px minmax(96px,128px) 1fr 74px;align-items:center;gap:11px;cursor:pointer;padding:5px 7px;border-radius:10px;transition:background .15s}
.bar-row:hover{background:var(--tint)}
.bar-rank{font-family:"Tajawal";font-weight:900;font-size:.95rem;color:var(--line);text-align:center;font-variant-numeric:tabular-nums}
.bar-row.active .bar-rank{color:var(--gold)}
.bar-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:11px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transform-origin:left;animation:ladgrow .7s cubic-bezier(.22,1,.36,1) both}
[dir="rtl"] .bar-fill{transform-origin:right}
.bar-row.active .bar-fill{background:linear-gradient(90deg,var(--gold),var(--gold2))!important}
.bar-row.active .bar-name{color:var(--gold2);font-weight:800}
.bar-row:hover .bar-name{color:var(--pine)}
.bar-val{font-family:"Tajawal";font-weight:800;font-size:.82rem;color:var(--ink2);text-align:start}
.ai{padding:22px;background:linear-gradient(165deg,#0E5249,#072F2C);color:#EAF3F1;border:none;position:relative;overflow:hidden}
.ai::after{content:"";position:absolute;top:-40px;inset-inline-end:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(194,152,47,.18),transparent 70%)}
.ai .sec-h{color:#fff;justify-content:space-between}
.ai .sec-h .lhs{display:flex;align-items:center;gap:9px}
.spark{width:30px;height:30px;border-radius:9px;background:rgba(194,152,47,.22);display:grid;place-items:center;border:1px solid rgba(194,152,47,.42)}
.spark svg{width:16px;height:16px;color:var(--gold)}
.ai .sec-s{color:#8FB3AD}
.ai-body{font-size:.9rem;line-height:1.85;color:#D9E8E5}
.ai-list{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.ai-list li{display:flex;gap:11px;font-size:.83rem;align-items:flex-start}
.tk{flex:none;margin-top:6px;width:7px;height:7px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.speak-btn{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.12);color:#EAF3F1;display:grid;place-items:center;transition:.15s;flex:none}
.speak-btn:hover{background:rgba(194,152,47,.3)}
.speak-btn.on{background:var(--gold);color:#0B3B37}
.speak-btn svg{width:16px;height:16px}
.mute-btn{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--pine);display:grid;place-items:center;border:1px solid var(--line);transition:.15s;flex:none;margin-inline-start:10px}
.mute-btn:hover{background:#DCEAE5}
.mute-btn.muted{background:#FBE9E8;color:#C84B3C;border-color:#F1CFCC}
.mute-btn svg{width:18px;height:18px}
/* tile map */
.tilemap-card{padding:20px}
.water-strip{height:10px;border-radius:999px;background:linear-gradient(90deg,#BBD6E4,#8FC0D8,#BBD6E4);margin-bottom:14px;opacity:.8;position:relative}
.water-strip::after{content:attr(data-l);position:absolute;inset-inline-start:10px;top:-2px;font-size:.62rem;color:#5E89A0;font-weight:700}
.tiles{display:flex;flex-direction:column;gap:6px;max-height:clamp(360px,56vh,600px);overflow-y:auto;padding-inline-end:8px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.tiles::-webkit-scrollbar{width:9px}
.tiles::-webkit-scrollbar-track{background:var(--tint);border-radius:99px}
.tiles::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold),var(--gold2));border-radius:99px;border:2px solid var(--card)}
.tiles::-webkit-scrollbar-thumb:hover{background:var(--gold2)}
.lad-row{display:grid;grid-template-columns:38px 1fr;gap:13px;align-items:center;padding:11px 14px 11px 8px;border-radius:13px;cursor:pointer;transition:background .15s,border-color .15s;border:1px solid transparent}
.lad-row:hover{background:var(--tint);border-color:var(--line)}
.lad-row.sel{background:linear-gradient(90deg,rgba(194,152,47,.13),rgba(194,152,47,.02));border-color:var(--gold)}
[dir="rtl"] .lad-row.sel{background:linear-gradient(270deg,rgba(194,152,47,.13),rgba(194,152,47,.02))}
.lad-rank{font-family:"Tajawal";font-weight:900;font-size:1.45rem;color:var(--line);text-align:center;line-height:1;font-variant-numeric:tabular-nums;transition:color .15s}
.lad-row:hover .lad-rank{color:#4E93B5}
.lad-row.sel .lad-rank{color:var(--gold)}
.lad-main{min-width:0}
.lad-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.lad-name{font-family:"Tajawal";font-weight:800;font-size:.95rem;color:var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad-name .tanchor{color:#4E93B5;font-size:.8rem;flex:none}
.lad-val{font-family:"Tajawal";font-weight:900;font-size:1rem;color:var(--pine);white-space:nowrap;flex:none}
.lad-val .cur{font-size:.6rem;color:var(--muted);font-weight:700}
.lad-bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin-bottom:7px}
.lad-fill{height:100%;border-radius:99px;transform-origin:left;animation:ladgrow .65s cubic-bezier(.22,1,.36,1) both}
[dir="rtl"] .lad-fill{transform-origin:right}
@keyframes ladgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lad-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.7rem}
.lad-arra{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad-arra b{font-family:"Tajawal";color:var(--gold2)}
.lad-src{display:flex;gap:8px;flex:none}
.lad-src span{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-weight:600}
.lad-src i{width:6px;height:6px;border-radius:50%;flex:none}
@media (max-width:560px){.lad-arra{display:none}.lad-rank{font-size:1.2rem}}
.legend{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.75rem;color:var(--muted);font-weight:600}
.legbar{height:10px;flex:1;border-radius:6px;background:linear-gradient(90deg,#D7E8E2,#2E8B81,#0B4A45)}
#leafmap{height:560px;width:100%;border-radius:14px;position:relative;z-index:1;border:1px solid var(--line)}
.maplg{margin-inline-start:6px}
.legend .maplg.bayut{margin-inline-start:auto}
.map-note{font-size:.73rem;color:var(--faint);margin-top:10px;line-height:1.55}
.map-toggle{display:inline-flex;background:#EDF2F0;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-inline-start:auto}
.map-toggle button{font-family:"Tajawal";font-size:.74rem;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:999px;transition:.15s;white-space:nowrap}
.map-toggle button.active{background:var(--pine);color:#fff}
.price-tip{background:var(--pine);color:#fff;border:none;border-radius:8px;font-family:"Tajawal";font-weight:700;font-size:11px;padding:2px 8px;box-shadow:0 2px 6px rgba(11,74,69,.35);white-space:nowrap}
.price-tip.leaflet-tooltip-top:before{border-top-color:var(--pine)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 30px -8px rgba(11,74,69,.4)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.mp-h{font-family:"Tajawal";font-weight:800;font-size:1rem;color:var(--pine);margin-bottom:6px}
.mp-avg{font-family:"Tajawal";font-weight:900;font-size:1.25rem;color:var(--ink);margin-bottom:10px}
.mp-avg span:last-child{font-size:.7rem;font-weight:600;color:var(--muted);font-family:"IBM Plex Sans Arabic"}
.mp-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 0}
.mp-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);font-size:.74rem;color:var(--muted)}
@media (max-width:560px){#leafmap{height:400px}}
.map-wrap{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:stretch}
.area-info{padding:20px;display:flex;flex-direction:column}
.ai-stat{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line2)}
.ai-stat:last-of-type{border-bottom:none}
.ai-stat .l{font-size:.82rem;color:var(--muted);font-weight:600}
.ai-stat .v{font-family:"Tajawal";font-weight:800;font-size:1.1rem}
.mini-rank{margin-top:auto;padding-top:14px}
/* table */
.tbl-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pills{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill-f{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;transition:.15s}
.pill-f:hover{border-color:var(--teal);color:var(--pine)}
.pill-f.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.tbl-act{margin-inline-start:auto;display:flex;gap:9px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
thead th{font-size:.73rem;font-weight:700;color:var(--muted);text-align:start;padding:14px 18px;border-bottom:1px solid var(--line);background:#F8FBFA;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--pine)}
thead th .sortar{margin-inline-start:5px;opacity:.4}
thead th.sorted{color:var(--pine)}thead th.sorted .sortar{opacity:1}
tbody td{padding:14px 18px;border-bottom:1px solid var(--line2);text-align:start}
tbody tr{transition:.12s;cursor:pointer}tbody tr:hover{background:#F6FAF8}
tbody tr:last-child td{border-bottom:none}
.pname{font-weight:700}.pname .ps{display:block;font-size:.73rem;color:var(--faint);font-weight:500;margin-top:1px}
.rent{font-family:"Tajawal";font-weight:800;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:700;padding:4px 10px;border-radius:7px}
.src.bayut{color:#0C7A52;background:#E5F5EE}.src.dub{color:#A92A24;background:#FBE9E8}
.src.pf{color:#5A3FA0;background:#EDE8FA}
.src i{width:6px;height:6px;border-radius:50%}.src.bayut i{background:#1F9E6E}.src.dub i{background:#D43B33}.src.pf i{background:#7B5FD0}
.mp-arra{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;margin-bottom:4px;border-bottom:1px dashed var(--line);font-size:.78rem}
.mp-arra span{color:var(--muted);font-weight:600}.mp-arra b{font-family:"Tajawal";color:var(--gold2)}
.empty{padding:40px;text-align:center;color:var(--faint);font-size:.9rem}
/* charts */
.chart-card{padding:20px}
.line-svg,.dist-svg{width:100%;height:auto;display:block}
.gridline{stroke:#EAEFED;stroke-width:1}
.axlabel{font-family:"IBM Plex Sans Arabic";font-size:11px;fill:var(--faint)}
.lpath{fill:none;stroke:var(--pine-soft);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.larea{fill:url(#lg)}
.ldot{fill:#fff;stroke:var(--pine-soft);stroke-width:2.5}
.ldot.last{fill:var(--gold);stroke:var(--gold2)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,33,30,.5);backdrop-filter:blur(4px);display:none;place-items:center;z-index:100;padding:18px}
.modal-bg.show{display:grid;animation:fade .25s}
.modal{background:var(--card);border-radius:20px;max-width:440px;width:100%;box-shadow:var(--sh-lg);overflow:hidden;animation:pop .3s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal-h{padding:20px 22px;background:linear-gradient(150deg,var(--pine),var(--pine2));color:#fff;position:relative}
.modal-h .eyebrow{color:var(--gold-soft)}
.modal-h h3{font-family:"Tajawal";font-weight:800;font-size:1.2rem;margin-top:3px}
.modal-x{position:absolute;top:16px;inset-inline-end:16px;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.modal-x:hover{background:rgba(255,255,255,.26)}
.modal-b{padding:8px 22px 18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:none}
.mrow .l{font-size:.84rem;color:var(--muted);font-weight:600}
.mrow .v{font-family:"Tajawal";font-weight:700}
.fair{margin:14px 22px 22px;background:var(--tint);border:1px solid #D3E3DD;border-radius:12px;padding:14px}
.fair .ft{font-size:.78rem;font-weight:700;color:var(--pine);margin-bottom:9px}
.fair-bar{height:8px;background:linear-gradient(90deg,var(--up),#E0C04A,var(--down));border-radius:999px;position:relative}
.fair-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%)}
.fair-cap{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:7px;font-weight:600}
/* AI assistant */
.asst{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:440px}
.asst-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.asst-orb{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#0E5249,#072F2C);display:grid;place-items:center;border:1px solid rgba(194,152,47,.4);flex:none}
.asst-orb svg{width:22px;height:22px;color:var(--gold)}
.asst-head h3{font-family:"Tajawal";font-weight:800;font-size:1.05rem}
.asst-head p{font-size:.76rem;color:var(--muted)}
.asst-status{margin-inline-start:auto;font-size:.72rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.asst-status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.asst-status.live i{background:var(--up);box-shadow:0 0 0 3px rgba(28,140,90,.2)}
.conv{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:13px 16px;border-radius:16px;font-size:.9rem;line-height:1.7;animation:fade .3s}
.msg.user{align-self:flex-end;background:var(--pine);color:#fff;border-bottom-inline-end-radius:5px}
.msg.bot{align-self:flex-start;background:#F2F6F4;color:var(--ink);border:1px solid var(--line);border-bottom-inline-start-radius:5px;position:relative}
.msg.bot .mspeak{margin-top:9px;font-size:.72rem;font-weight:700;color:var(--teal);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.msg.bot .mspeak svg{width:13px;height:13px}
.suggs{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 14px}
.sugg{font-size:.78rem;font-weight:600;color:var(--pine);background:var(--tint);border:1px solid #D3E3DD;border-radius:999px;padding:8px 14px;transition:.15s}
.sugg:hover{background:var(--pine);color:#fff;border-color:var(--pine)}
.asst-input{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.asst-input input{flex:1;border:1px solid var(--line);background:#F6F9F8;border-radius:12px;padding:13px 16px;font-family:inherit;font-size:.9rem}
.asst-input input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,139,129,.13)}
.mic-btn{width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(150deg,var(--pine-soft),var(--pine2));color:#fff;display:grid;place-items:center;transition:.18s;box-shadow:0 6px 16px -7px rgba(11,74,69,.6)}
.mic-btn:hover{filter:brightness(1.1)}
.mic-btn svg{width:21px;height:21px}
.mic-btn.listening{background:linear-gradient(150deg,#C84B3C,#A23529);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,75,60,.5)}70%{box-shadow:0 0 0 14px rgba(200,75,60,0)}100%{box-shadow:0 0 0 0 rgba(200,75,60,0)}}
.send-btn{width:48px;height:48px;border-radius:50%;flex:none;background:var(--gold);color:#0B3B37;display:grid;place-items:center;transition:.15s}
.send-btn:hover{filter:brightness(1.05)}
.send-btn svg{width:20px;height:20px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding:4px 2px}
.sources{font-size:.77rem;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sources b{color:var(--pine);font-weight:700}
.demo-tag{font-size:.73rem;font-weight:700;color:#946A1B;background:var(--gold-soft);border:1px solid #E2CB94;padding:6px 12px;border-radius:8px}
@media (max-width:980px){.map-wrap{grid-template-columns:1fr}.g-main{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:8px;z-index:60;background:var(--pine2);overflow-x:auto}
  .sidebar::after,.s-brand,.nav-label,.s-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around;margin:0}
  .nav-item{flex-direction:column;gap:4px;padding:6px 8px;font-size:.62rem;border-radius:10px;white-space:nowrap}
  .nav-item.active::before{display:none}
  .content{padding-bottom:84px}
  .g-3{grid-template-columns:repeat(2,1fr)}
  .asst{height:auto}
}
@media (max-width:560px){.g-3{grid-template-columns:1fr}.search{display:none}
  thead th:nth-child(2),tbody td:nth-child(2),thead th:nth-child(5),tbody td:nth-child(5){display:none}}
.inp{width:100%;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 15px;box-shadow:var(--sh-sm)}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,139,129,.13)}
.est-form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:4px}
.est-card{margin-top:16px;background:linear-gradient(160deg,#F4F8F6,#EAF2EF);border:1px solid var(--line);border-radius:14px;padding:18px}
.est-l{font-size:.76rem;font-weight:700;color:var(--muted)}
.est-v{font-family:"Tajawal";font-weight:900;font-size:2rem;color:var(--pine);line-height:1.1;margin:4px 0}
.est-range{font-size:.78rem;color:var(--muted);font-weight:600}
.est-note{font-size:.84rem;color:var(--ink2);margin-top:12px;line-height:1.7}
.est-arra{margin-top:9px;font-size:.8rem;color:var(--muted);font-weight:600}.est-arra b{color:var(--gold2);font-family:"Tajawal"}

.est-pos-n{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:7px;text-align:center}
.deal{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:7px}
.deal.under{color:#0C7A52;background:#E3F5EC}
.deal.fair{color:#8A6D1B;background:#F4EBCF}
.deal.over{color:#A92A24;background:#FBE9E8}
.rep-preview{margin:14px 0;display:flex;flex-direction:column;gap:1px;background:var(--tint);border-radius:12px;padding:6px 14px}
.rep-prev-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #DCE8E3;font-size:.84rem}
.rep-prev-row:last-child{border-bottom:none}
.rep-prev-row span{color:var(--muted);font-weight:600}
.rep-prev-row b{font-family:"Tajawal"}
.modal.report{max-width:700px;max-height:90vh;overflow-y:auto}
.rep-doc{padding:26px}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--pine);padding-bottom:14px;margin-bottom:16px}
.rep-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:1.2px;color:var(--gold2);text-transform:uppercase}
.rep-head h2{font-family:"Tajawal";font-weight:900;font-size:1.5rem;color:var(--pine);margin:3px 0}
.rep-date{font-size:.78rem;color:var(--muted)}
.rep-logo{width:46px;height:46px;border-radius:12px;background:var(--pine);display:grid;place-items:center;flex:none}

.rep-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.rep-kpis>div{background:var(--tint);border-radius:10px;padding:11px}
.rep-kpis span{font-size:.7rem;color:var(--muted);font-weight:600;display:block}
.rep-kpis b{font-family:"Tajawal";font-weight:800;font-size:1.05rem;color:var(--ink)}
.rep-srcs{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:.82rem}
.rep-fc{margin-inline-start:auto;color:var(--muted);font-weight:600}
.rep-summary{font-size:.88rem;line-height:1.8;color:var(--ink2);background:#F6FAF8;border-inline-start:3px solid var(--teal);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.rep-arra{font-size:.78rem;color:var(--ink2);background:#FBF6E9;border:1px solid #ECDCB0;border-radius:8px;padding:9px 12px;margin-bottom:12px}.rep-arra b{font-family:"Tajawal";color:var(--gold2)}
.rep-sec{font-family:"Tajawal";font-weight:800;font-size:.95rem;color:var(--pine);margin:14px 0 8px}
.rep-tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:8px}
.rep-tbl th{text-align:start;font-size:.72rem;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:#F8FBFA}
.rep-tbl td{padding:8px 10px;border-bottom:1px solid var(--line2)}
.rep-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:.72rem;color:var(--faint);text-align:center}
.rep-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 26px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
@media (max-width:560px){.est-form{grid-template-columns:1fr}.rep-kpis{grid-template-columns:repeat(2,1fr)}}
@media print{body.show-report .app{display:none!important}body.show-report #modalBg{display:none!important}body.show-report #reportBg{position:static;background:none;display:block;padding:0}body.show-report #reportModal{max-width:100%;box-shadow:none;max-height:none;border-radius:0}body.show-report .rep-actions{display:none!important}}
.btn.ghost{background:var(--card);color:var(--pine);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--tint)}
.dt-wrap{max-width:1040px;margin:0 auto;padding:4px 2px 10px}
.dt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.dt-back{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:700;font-size:.85rem;color:var(--pine);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;box-shadow:var(--sh-sm);transition:.15s}
.dt-back:hover{background:var(--tint);transform:translateX(-2px)}
.dt-back svg{width:16px;height:16px}
[dir="rtl"] .dt-back svg{transform:scaleX(-1)}

.dt-badge{font-size:.8rem;padding:6px 14px}
.dt-headline{margin-bottom:18px}

.dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}

.dt-vr.hot{background:var(--pine);color:#EAF3F1}

.dt-note{font-size:.76rem;color:var(--faint);margin-top:12px;line-height:1.6}

@media (max-width:560px){.dt-hero-rent{font-size:2.1rem}.dt-headline h1{font-size:1.35rem}.dt-hero-stats{grid-template-columns:1fr 1fr}.comp-grid{grid-template-columns:1fr 1fr}.dt-actions{flex-direction:column}.dt-actions .btn{width:100%;justify-content:center}}

.exec-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;transition:.18s}
.exec-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -18px rgba(11,59,55,.4)}
.exec-card.gold{background:linear-gradient(160deg,#FBF6E9,#F7EFD7);border-color:#ECDCB0}
.exec-ic{width:34px;height:34px;border-radius:10px;background:var(--tint);display:grid;place-items:center;margin-bottom:11px}
.exec-ic svg{width:18px;height:18px;color:var(--teal)}
.exec-card.gold .exec-ic{background:#fff}.exec-card.gold .exec-ic svg{color:var(--gold2)}
.exec-l{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.exec-v{font-family:"Tajawal";font-weight:900;font-size:1.3rem;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exec-card.gold .exec-v{color:var(--gold2)}
.exec-s{font-size:.72rem;color:var(--faint);font-weight:600;margin-top:5px;display:flex;align-items:center;gap:4px}
.exec-s .trend{font-size:.72rem}
.opp-wrap{width:100%;overflow-x:auto;position:relative}
.opp-svg{width:100%;min-width:580px;height:auto;display:block}
.opp-tip{position:absolute;transform:translate(-50%,-100%);background:var(--pine);color:#fff;padding:7px 11px;border-radius:9px;font-size:.74rem;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:1px}
.opp-tip.show{opacity:1}
.opp-tip b{font-family:"Tajawal";font-weight:800}
.opp-tip span{color:#CDE5E0;font-weight:600}
.opp-grid{stroke:var(--line2);stroke-width:1}
.opp-axis{stroke:var(--line);stroke-width:1.5}
.opp-ax{fill:var(--muted);font-size:11px;font-weight:600}
.opp-axt{fill:var(--muted);font-size:12px;font-weight:700}
.opp-zone{fill:rgba(46,139,129,.07);stroke:rgba(46,139,129,.28);stroke-dasharray:4 4}
.opp-zonelbl{fill:var(--teal);font-size:11px;font-weight:800;letter-spacing:.3px}
.opp-lbl{fill:var(--ink);font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px}
.opp-b{transition:.12s}
.opp-b:hover circle{fill-opacity:.85;stroke:#0B4A45;stroke-width:2}
.cmp-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 16px}
.cmp-tbl-wrap{overflow-x:auto}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:.86rem;min-width:420px}
.cmp-tbl th{text-align:center;font-family:"Tajawal";font-weight:800;color:var(--pine);padding:11px 12px;border-bottom:2px solid var(--line);font-size:.92rem}
.cmp-tbl th:first-child{text-align:start}
.cmp-tbl td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line2);font-family:"Tajawal";font-weight:700;color:var(--ink)}
.cmp-l{text-align:start!important;color:var(--muted)!important;font-weight:600!important;font-family:inherit!important;font-size:.8rem}
.cmp-best{background:rgba(31,158,110,.1);color:#0C7A52!important;position:relative}
.cmp-best:after{content:"✓";position:absolute;top:3px;inset-inline-end:5px;font-size:.6rem;color:#1F9E6E}
.roi-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin-top:4px}
.roi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.roi-cell{background:var(--tint);border-radius:12px;padding:13px}
.roi-cell span{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.roi-cell b{font-family:"Tajawal";font-weight:900;font-size:1.25rem;color:var(--pine)}
.roi-cell b small{font-size:.62rem;color:var(--muted);font-weight:600}
.roi-cell.hot{background:var(--pine)}.roi-cell.hot span{color:#A9CFC9}.roi-cell.hot b{color:#fff}
@media (max-width:900px){.exec-grid{grid-template-columns:repeat(3,1fr)}.roi-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.exec-grid{grid-template-columns:repeat(2,1fr)}.cmp-pick{grid-template-columns:1fr}.roi-form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 Object.keys(UNIT_TYPES).forEach((uk,ui)=>{const ut=UNIT_TYPES[uk];for(let i=0;i<3;i++){const sd=ai*61+ui*23+i*9+500;const base=ut.sizes[i%ut.sizes.length];const size=Math.round((base+seeded(sd)*base*0.2)/50)*50;const perSqft=Math.max(8,Math.round(ut.base*af*(0.85+seeded(sd+4)*0.36)));const rent=Math.round((size*perSqft)/500)*500;
  out.push({id:id++,area:ak,utype:uk,size,perSqft,rent,src:SRC3[Math.floor(seeded(sd+7)*3)%3],dom:5+Math.floor(seeded(sd+2)*60)});}});});return out;})();
function unitsOf(area,ut){return UNITS.filter(u=>u.area===area&&(ut==="all"||u.utype===ut));}
function unitStat(area,ut){const l=unitsOf(area,ut);if(!l.length)return{low:0,avg:0,high:0,count:0,psAvg:0};const r=l.map(x=>x.rent);return{low:Math.min(...r),high:Math.max(...r),avg:Math.round(r.reduce((a,b)=>a+b,0)/r.length),count:l.length,psAvg:Math.round(l.reduce((a,b)=>a+b.perSqft,0)/l.length)};}
function unitSrcAvg(area,ut,src){const l=UNITS.filter(u=>u.area===area&&(ut==="all"||u.utype===ut)&&u.src===src);if(!l.length)return 0;return Math.round(l.reduce((a,b)=>a+b.rent,0)/l.length);}
function listOf(area,type){return LISTINGS.filter(l=>l.area===area&&(type==="all"||l.type===type));}
function stat(list){if(!list.length)return{low:0,avg:0,high:0,count:0,sqft:0};const r=list.map(l=>l.rent);
 return{low:Math.min(...r),high:Math.max(...r),avg:Math.round(r.reduce((a,b)=>a+b,0)/r.length),count:list.length,
  sqft:Math.round(list.reduce((a,b)=>a+b.perSqft,0)/list.length*10)/10};}
function areaAvg(area,type){return stat(listOf(area,type||"all")).avg;}
function srcName(s){return s==="bayut"?"Bayut":s==="pf"?"Property Finder":"Dubizzle";}
function areaSale(area,type){const l=listOf(area,type||"all");if(!l.length)return Math.round(AREAS[area].saleBase*(type?TYPES[type].f:1));return Math.round(l.reduce((a,b)=>a+b.salePerSqft,0)/l.length);}
function areaYield(area){const l=listOf(area,"all");if(!l.length)return 6.5;return Math.round(l.reduce((a,b)=>a+b.yld,0)/l.length*10)/10;}

const $=id=>document.getElementById(id);
function TR(){return T[LANG];}
function aName(ak){const a=AREAS[ak]||AREAS[Object.keys(AREAS)[0]];return TR().areaPrefix+a[LANG];}
function tName(tk){return TYPES[tk][LANG];}
function lerp(t){const c=[[215,232,226],[46,139,129],[11,74,69]];const seg=t<.5?0:1;const lt=t<.5?t*2:(t-.5)*2;
 const a=c[seg],b=c[seg+1];return`rgb(${Math.round(a[0]+(b[0]-a[0])*lt)},${Math.round(a[1]+(b[1]-a[1])*lt)},${Math.round(a[2]+(b[2]-a[2])*lt)})`;}
function countUp(el,target){if(RM){el.textContent=fmt(target);return;}const dur=750,st=performance.now();
 (function tick(now){let p=Math.min(1,(now-st)/dur);p=1-Math.pow(1-p,3);el.textContent=fmt(target*p);if(p<1)requestAnimationFrame(tick);})(performance.now());}

/* dynamic AI summary */
function genSummary(area,type,lang){const a=AREAS[area];const s=stat(listOf(area,type));
 const rank=Object.keys(AREAS).map(k=>areaAvg(k,type)).sort((x,y)=>y-x).indexOf(areaAvg(area,type))+1;
 const N=Object.keys(AREAS).length;const dir=a.trend>=0;
 // cheapest type in this area
 let cheapT=null,cmin=1e12;Object.keys(TYPES).forEach(tk=>{const av=stat(listOf(area,tk)).avg;if(av&&av<cmin){cmin=av;cheapT=tk;}});
 if(lang==="ar"){
  return `${a.ar} ${dir?"تشهد ارتفاعاً":"تشهد تراجعاً"} بنسبة ${Math.abs(a.trend)}% خلال 6 أشهر، بمتوسط إيجار أرض حوالي ${fmt(s.avg)} درهم سنوياً. القطع ${TYPES.commercial.ar} في الحد الأعلى للسعر، بينما ${TYPES[cheapT].ar} توفّر أفضل قيمة. ترتيب المنطقة ${rank} من ${N} حسب متوسط إيجار الأرض.`;
 }
 return `${a.en} is ${dir?"up":"down"} ${Math.abs(a.trend)}% over six months, with average land rent around ${fmt(s.avg)} AED/year. ${TYPES.commercial.en} sits at the top of the range, while ${TYPES[cheapT].en} offers the best value. It ranks ${rank} of ${N} areas by average land rent.`;
}

function parseQuery(q){const ql=q.toLowerCase();let area=null,type=null,intent="summary";

 if(!area){for(const ak of Object.keys(AREAS)){const bn=normName(AREAS[ak].en),ba=normName(AREAS[ak].ar);if((bn.length>2&&ql.includes(bn))||(ba.length>1&&q.includes(ba))){area=ak;break;}}}

 if(/cheap|lowest|سب سے کم|sasta|أرخص|أقل|affordable|best value/.test(ql))intent="cheapest";

 const priceish=/rent|price|sqft|rate|value|سعر|أسعار|إيجار|إيجارات|قيمة|كرايه|kiraya/.test(q.toLowerCase());
 let ans,matched=p.area||p.type||p.intent!=="summary"||priceish;
 if(p.intent==="cheapest"){const c=ranked[0];selArea=c.k;ans=LANG==="ar"
   ?`أرخص منطقة لـ${tName(type)} هي <b>${AREAS[c.k].ar}</b> بمتوسط إيجار <b>${fmt(c.v)} درهم</b> سنوياً.`
   :`The most affordable area for ${TYPES[type].en} is <b>${AREAS[c.k].en}</b>, averaging <b>${fmt(c.v)} AED</b> per year.`;}
 else if(p.intent==="highest"){const c=ranked[ranked.length-1];selArea=c.k;ans=LANG==="ar"

   :`In <b>${AREAS[selArea].en}</b>, ${TYPES[type].en} averages <b>${fmt(av)} AED</b> — ${Math.abs(diff)}% ${diff>=0?"above":"below"} the Ajman average of ${fmt(emAvg)} AED.`;}
 else{const s=stat(listOf(selArea,type));ans=LANG==="ar"
   ?`في <b>${AREAS[selArea].ar}</b>، يتراوح إيجار ${tName(type)} من <b>${fmt(s.low)}</b> إلى <b>${fmt(s.high)} درهم</b> سنوياً، بمتوسط <b>${fmt(s.avg)}</b>، وعدد العروض ${s.count}.`
   :`In <b>${AREAS[selArea].en}</b>, ${TYPES[type].en} ranges from <b>${fmt(s.low)}</b> to <b>${fmt(s.high)} AED</b>/year, averaging <b>${fmt(s.avg)}</b>, across ${s.count} listings.`;}
 if(!matched)ans=t.asstNoMatch;

 recog.onstart=()=>{listening=true;$("micBtn").classList.add("listening");setStatus("listening");};
 recog.onresult=e=>{const tr=e.results[0][0].transcript;$("asstInput").value=tr;};
 recog.onerror=e=>{listening=false;$("micBtn").classList.remove("listening");setStatus("ready");if(e.error==="not-allowed"||e.error==="service-not-allowed")addMsg(LANG==="ar"?"يرجى السماح بالوصول إلى الميكروفون (يعمل بشكل أفضل بعد النشر على الإنترنت).":"Please allow microphone access (works best once deployed online).","bot");};
 recog.onend=()=>{listening=false;$("micBtn").classList.remove("listening");setStatus("ready");const v=$("asstInput").value;if(v.trim())sendQuery(v);};
 try{recog.start();}catch(e){}}

/* ===== AI STUDIO: estimator + report + deal logic ===== */
function compAvgSqft(area,type){const l=listOf(area,type);if(!l.length)return AREAS[area].saleBase*TYPES[type].f*0.065;return l.reduce((a,b)=>a+b.perSqft,0)/l.length;}
function dealLevel(l){const av=compAvgSqft(l.area,l.type);const r=l.perSqft/(av||1);if(r<0.9)return"under";if(r>1.1)return"over";return"fair";}
function fillStudioSelects(){
 const ao=Object.keys(AREAS).map(k=>`<option value="${k}">${AREAS[k][LANG]}</option>`).join("");
 const to=Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k][LANG]}</option>`).join("");
 $("estArea").innerHTML=ao;$("estType").innerHTML=to;$("estArea").value=selArea;$("estType").value=selType;
 if($("roiArea")){$("roiArea").innerHTML=ao;$("roiType").innerHTML=to;$("roiArea").value=selArea;$("roiType").value=selType;}}
function renderStudio(){const t=TR();fillStudioSelects();const s=stat(listOf(selArea,"all"));
 $("repPreview").innerHTML=`<div class="rep-prev-row"><span>${t.areaLbl}</span><b>${aName(selArea)}</b></div><div class="rep-prev-row"><span>${t.mapAvg}</span><b class="num">${fmt(s.avg)} ${t.cur}</b></div><div class="rep-prev-row"><span>${t.miCount}</span><b class="num">${s.count}</b></div>`;}
function estimateRent(){const t=TR();const area=$("estArea").value,type=$("estType").value,size=+$("estSize").value||0,target=+$("estTarget").value||0;
 if(size<=0){$("estResult").innerHTML=`<div class="est-hint">${t.estHint}</div>`;return;}
 const salePerSqft=areaSale(area,type);const saleTotal=size*salePerSqft;
 const r5=Math.round(saleTotal*0.05/500)*500,r8=Math.round(saleTotal*0.08/500)*500,mid=Math.round(saleTotal*0.065/500)*500;
 const note=LANG==="ar"?`قيمة الأرض حسب ARRA حوالي ${fmt(saleTotal)} درهم (${fmt(salePerSqft)} د.إ/قدم). بتطبيق عائد 5–8٪ يُقدَّر الإيجار السنوي بين ${fmt(r5)} و${fmt(r8)} درهم.`:`ARRA land value ≈ ${fmt(saleTotal)} AED (${fmt(salePerSqft)} AED/sqft). Applying a 5–8% yield, the estimated annual rent is ${fmt(r5)}–${fmt(r8)} AED.`;
 let pos="";if(target>0){const r=target/mid;const cls=r<0.92?"under":r>1.08?"over":"fair";const lbl=cls==="under"?t.estBelow:cls==="over"?t.estAbove:t.estFair;const pct=Math.round((target-mid)/mid*100);const ppos=Math.max(4,Math.min(96,((target-r5)/((r8-r5)||1))*100));
  pos=`<div class="est-pos"><div class="est-pos-h">${t.estPos} <b class="deal ${cls}">${lbl}</b></div><div class="fair-bar"><div class="fair-dot" style="left:${ppos}%"></div></div><div class="fair-cap"><span class="num">${fmt(r5)} · 5%</span><span class="num">${fmt(r8)} · 8%</span></div><div class="est-pos-n">${pct>=0?"+":""}${pct}% ${LANG==="ar"?"مقابل التقدير":"vs estimate"}</div></div>`;}
 $("estResult").innerHTML=`<div class="est-card"><div class="est-l">${t.estResult} <span style="font-weight:600;color:var(--muted)">· 6.5% ${t.yieldL}</span></div><div class="est-v"><span class="num">${fmt(mid)}</span> <span class="cur">${t.cur}</span></div><div class="est-range">${t.estRange} (5–8%): <span class="num">${fmt(r5)} – ${fmt(r8)}</span></div><div class="est-arra"><span>${t.arraSale}:</span> <b class="num">${fmt(saleTotal)} ${t.cur}</b></div><div class="est-note">${note}</div>${pos}</div>`;}
function generateReport(){const t=TR();const ak=selArea;const a=AREAS[ak];const s=stat(listOf(ak,"all"));const by=srcAvg(ak,"bayut"),du=srcAvg(ak,"dub"),pf=srcAvg(ak,"pf"),sale=areaSale(ak),yld=areaYield(ak);
 const end=s.avg;const mg=a.trend/6/100;const f3=Math.round(end*(1+mg*2.55));const fcPct=Math.round((f3-end)/(end||1)*100);
 const byType=Object.keys(TYPES).map(tk=>{const ss=stat(listOf(ak,tk));return`<tr><td>${TYPES[tk][LANG]}</td><td class="num">${fmt(ss.low)}–${fmt(ss.high)}</td><td class="num">${fmt(ss.avg)}</td><td class="num">${ss.count}</td></tr>`;}).join("");
 const top=listOf(ak,"all").slice().sort((x,y)=>y.rent-x.rent).slice(0,5).map(l=>`<tr><td>${LANG==="ar"?TYPES[l.type].one:TYPES[l.type].oneEn}</td><td>${subName(l.area,l.subIdx)}</td><td class="num">${l.size.toLocaleString("en-US")}</td><td class="num">${fmt(l.rent)}</td><td><span class="src ${l.src}"><i></i>${srcName(l.src)}</span></td></tr>`).join("");
 const today=new Date().toLocaleDateString(LANG==="ar"?"ar-EG":"en-GB",{year:"numeric",month:"long",day:"numeric"});
 $("reportModal").innerHTML=`<div class="rep-doc" id="repDoc">
   <div class="rep-head"><div><div class="rep-eyebrow">${t.repHead}</div><h2>${aName(ak)}</h2><div class="rep-date">${today}</div></div><div class="rep-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#C2982F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-4 7 4v13"/></svg></div></div>
   <div class="rep-kpis"><div><span>${t.kLow}</span><b class="num">${fmt(s.low)}</b></div><div><span>${t.kAvg}</span><b class="num">${fmt(s.avg)}</b></div><div><span>${t.kHigh}</span><b class="num">${fmt(s.high)}</b></div><div><span>${t.miCount}</span><b class="num">${s.count}</b></div></div>
   <div class="rep-srcs"><span class="src bayut"><i></i>Bayut <b class="num">${fmt(by)}</b></span><span class="src dub"><i></i>Dubizzle <b class="num">${fmt(du)}</b></span><span class="src pf"><i></i>Property Finder <b class="num">${fmt(pf)}</b></span><span class="rep-fc">${t.repFc}: <b style="color:#9A6F1E">${fcPct>=0?"+":""}${fcPct}% → ${fmt(f3)} ${t.cur}</b></span></div>
   <div class="rep-arra">${t.rentBasis} &nbsp;·&nbsp; ${t.arraSale}: <b class="num">${fmt(sale)} ${t.cur}/${t.sqft}</b> · ${t.yieldL}: <b>${yld}%</b></div>
   <p class="rep-summary">${genSummary(ak,"all",LANG)}</p>
   <div class="rep-sec">${t.repByType}</div>
   <table class="rep-tbl"><thead><tr><th>${t.typeLbl}</th><th>${t.miRange}</th><th>${t.mapAvg}</th><th>${t.miCount}</th></tr></thead><tbody>${byType}</tbody></table>
   <div class="rep-sec">${t.repTop}</div>
   <table class="rep-tbl"><thead><tr><th>${t.thProp}</th><th>${t.thSub}</th><th>${t.thSize}</th><th>${t.thRent}</th><th>${t.thSrc}</th></tr></thead><tbody>${top}</tbody></table>
   <div class="rep-foot">${t.deptName} · Bayut · Dubizzle · ${t.demo}</div>
  </div>
  <div class="rep-actions"><button class="btn ghost" id="repCloseBtn">${t.repClose}</button><button class="btn" id="repPrintBtn">${t.repPrint}</button></div>`;
 $("reportBg").classList.add("show");document.body.classList.add("show-report");
 $("repCloseBtn").onclick=closeReport;$("repPrintBtn").onclick=()=>window.print();}
function closeReport(){$("reportBg").classList.remove("show");document.body.classList.remove("show-report");}
/* ===== INSIGHTS: exec dashboard + opportunity map + comparison ===== */
function execIcon(k){const m={plots:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',yield:'<path d="M3 17l6-6 4 4 8-8"/><path d="M16 7h5v5"/>',price:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',hot:'<path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5s3.5 1.5 4-5.5z"/>',top:'<path d="M3 21h18M5 21V8l7-4 7 4v13"/>'};return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m[k]||""}</svg>`;}
function renderExec(){const t=TR();const totalPlots=LISTINGS.length;const keys=Object.keys(AREAS);
 const avgYield=Math.round(LISTINGS.reduce((a,b)=>a+b.yld,0)/totalPlots*10)/10;
 const avgPrice=Math.round(LISTINGS.reduce((a,b)=>a+b.salePerSqft,0)/totalPlots);
 let hot=keys[0],top=keys[0];keys.forEach(k=>{if(AREAS[k].trend>AREAS[hot].trend)hot=k;if(areaAvg(k)>areaAvg(top))top=k;});
 const cards=[
  {ic:"plots",l:t.exTotalPlots,v:fmt(totalPlots),s:t.exAreas+": "+keys.length},
  {ic:"yield",l:t.exAvgYield,v:avgYield+"%",s:"5–8% "+t.yieldL,gold:true},
  {ic:"price",l:t.exAvgPrice,v:fmt(avgPrice)+" "+t.cur,s:"ARRA"},
  {ic:"hot",l:t.exHottest,v:AREAS[hot][LANG],s:'<span class="trend up">'+upI()+(AREAS[hot].trend>0?"+":"")+AREAS[hot].trend+"%</span>"},
  {ic:"top",l:t.exTopArea,v:AREAS[top][LANG],s:fmt(areaAvg(top))+" "+t.cur}];
 $("execStats").innerHTML=cards.map(c=>`<div class="exec-card${c.gold?' gold':''}"><div class="exec-ic">${execIcon(c.ic)}</div><div class="exec-l">${c.l}</div><div class="exec-v">${c.v}</div><div class="exec-s">${c.s}</div></div>`).join("");}
function renderOpportunity(){const t=TR();const keys=Object.keys(AREAS);
 const xs=keys.map(k=>areaSale(k)),ys=keys.map(k=>areaYield(k)),rs=keys.map(k=>areaAvg(k));
 const xMin=Math.min(...xs)*0.9,xMax=Math.max(...xs)*1.05,yMin=Math.min(...ys)-0.3,yMax=Math.max(...ys)+0.3,rMax=Math.max(...rs)||1;
 const W=760,H=430,pl=54,pr=18,pt=22,pb=46,iw=W-pl-pr,ih=H-pt-pb;const rtl=LANG==="ar";
 const X=v=>rtl?(pl+iw-(v-xMin)/((xMax-xMin)||1)*iw):(pl+(v-xMin)/((xMax-xMin)||1)*iw);
 const Y=v=>pt+ih-(v-yMin)/((yMax-yMin)||1)*ih;const R=v=>5+Math.sqrt(v/rMax)*12;
 let grid="",bubbles="";
 for(let i=0;i<=4;i++){const yv=yMin+(yMax-yMin)*i/4;const yy=Y(yv);grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" class="opp-grid"/><text x="${rtl?W-pr+6:pl-8}" y="${yy+4}" class="opp-ax" text-anchor="${rtl?'start':'end'}">${yv.toFixed(1)}%</text>`;}
 for(let i=0;i<=4;i++){const xv=xMin+(xMax-xMin)*i/4;const xx=X(xv);grid+=`<text x="${xx}" y="${H-pb+22}" class="opp-ax" text-anchor="middle">${Math.round(xv)}</text>`;}
 const halfX=X((xMin+xMax)/2);
 const order=keys.slice().sort((a,b)=>(a===selArea?1:0)-(b===selArea?1:0));
 order.forEach(k=>{const cx=X(areaSale(k)),cy=Y(areaYield(k)),r=R(areaAvg(k));const up=AREAS[k].trend>=0;const fill=up?"#2E9E70":"#E08A86";const sel=k===selArea;
  bubbles+=`<g class="opp-b${sel?' sel':''}" data-area="${k}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" fill-opacity="${sel?0.95:0.4}" stroke="${sel?'#C2982F':'#fff'}" stroke-width="${sel?3:1}"/>${sel?`<text x="${cx}" y="${cy-r-6}" class="opp-lbl" text-anchor="middle">${AREAS[k][LANG]}</text>`:""}</g>`;});
 $("oppChart").innerHTML=`<div class="opp-wrap"><div class="opp-tip" id="oppTip"></div><svg viewBox="0 0 ${W} ${H}" class="opp-svg" preserveAspectRatio="xMidYMid meet">
   <rect x="${rtl?halfX:pl}" y="${pt}" width="${iw/2}" height="${ih/2}" rx="8" class="opp-zone"/>
   <text x="${rtl?W-pr-10:pl+10}" y="${pt+17}" class="opp-zonelbl" text-anchor="${rtl?'end':'start'}">★ ${t.oppBest}</text>
   ${grid}
   <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" class="opp-axis"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" class="opp-axis"/>
   <text x="${pl+iw/2}" y="${H-6}" class="opp-axt" text-anchor="middle">${t.oppX}</text>
   <text transform="translate(${rtl?W-12:15},${pt+ih/2}) rotate(${rtl?90:-90})" class="opp-axt" text-anchor="middle">${t.oppY}</text>
   ${bubbles}
  </svg></div>`;
 const wrap=$("oppChart").querySelector(".opp-wrap"),tip=$("oppTip");
 wrap.querySelectorAll(".opp-b").forEach(g=>{const k=g.dataset.area;g.style.cursor="pointer";
  g.addEventListener("mouseenter",()=>{tip.innerHTML=`<b>${AREAS[k][LANG]}</b><span>${fmt(areaAvg(k))} ${t.cur} · ${areaYield(k)}% · ${areaSale(k)}/${t.sqft}</span>`;tip.classList.add("show");});
  g.addEventListener("mousemove",e=>{const r=wrap.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top-14)+"px";});
  g.addEventListener("mouseleave",()=>tip.classList.remove("show"));
  g.onclick=()=>setArea(k);});}
function fillCmpSelects(){const opts='<option value="">—</option>'+Object.keys(AREAS).map(k=>`<option value="${k}">${AREAS[k][LANG]}</option>`).join("");
 ["cmpA","cmpB","cmpC"].forEach(id=>{const el=$(id);const v=el.value;el.innerHTML=opts;el.value=v;});
 if(!$("cmpA").value)$("cmpA").value=selArea;
 if(!$("cmpB").value){const r=Object.keys(AREAS).slice().sort((a,b)=>areaAvg(b)-areaAvg(a));$("cmpB").value=(r[0]===selArea?r[1]:r[0]);}
 if(!$("cmpC").value){const r=Object.keys(AREAS).slice().sort((a,b)=>areaAvg(a)-areaAvg(b));$("cmpC").value=(r[0]===selArea||r[0]===$("cmpB").value?r[1]:r[0]);}}
function renderComparison(){const t=TR();const sel=["cmpA","cmpB","cmpC"].map(id=>$(id).value).filter(Boolean);
 if(!sel.length){$("cmpOut").innerHTML="";return;}
 const ord=Object.keys(AREAS).slice().sort((a,b)=>areaAvg(b)-areaAvg(a));const ranks={};ord.forEach((k,i)=>ranks[k]=i+1);
 const rows=[
  {l:t.arraSale,f:k=>fmt(areaSale(k))+" "+t.cur,best:k=>-areaSale(k)},
  {l:t.miAvg,f:k=>fmt(areaAvg(k))+" "+t.cur,best:k=>areaAvg(k)},
  {l:t.yieldL,f:k=>areaYield(k)+"%",best:k=>areaYield(k)},
  {l:t.compTrend,f:k=>(AREAS[k].trend>0?"+":"")+AREAS[k].trend+"%",best:k=>AREAS[k].trend},
  {l:t.compPlots,f:k=>fmt(listOf(k,"all").length),best:k=>null},
  {l:t.compRank,f:k=>"#"+ranks[k],best:k=>-ranks[k]}];
 const head=`<tr><th></th>${sel.map(k=>`<th>${AREAS[k][LANG]}</th>`).join("")}</tr>`;
 const body=rows.map(r=>{let bestK=null,bestV=-Infinity;if(r.best(sel[0])!==null)sel.forEach(k=>{const v=r.best(k);if(v>bestV){bestV=v;bestK=k;}});
  return`<tr><td class="cmp-l">${r.l}</td>${sel.map(k=>`<td class="${k===bestK?'cmp-best':''}">${r.f(k)}</td>`).join("")}</tr>`;}).join("");
 $("cmpOut").innerHTML=`<div class="cmp-tbl-wrap"><table class="cmp-tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;}
function renderInsights(){renderExec();renderOpportunity();fillCmpSelects();renderComparison();}
function calcROI(){const t=TR();const budget=+$("roiBudget").value||0,area=$("roiArea").value,type=$("roiType").value;
 if(budget<=0){$("roiResult").innerHTML=`<div class="est-hint">${t.roiHint}</div>`;return;}
 const pps=areaSale(area,type);const sqft=Math.round(budget/(pps||1));const yp=areaYield(area);const y=yp/100;
 const rent=Math.round(budget*y/500)*500;const r5=Math.round(budget*0.05/500)*500,r8=Math.round(budget*0.08/500)*500;
 const payback=Math.round(1/(y||1)*10)/10;const five=rent*5;
 $("roiResult").innerHTML=`<div class="est-card"><div class="roi-grid">
   <div class="roi-cell"><span>${t.roiLand}</span><b class="num">${fmt(sqft)} <small>${t.sqft}</small></b></div>
   <div class="roi-cell"><span>${t.roiRent}</span><b class="num">${fmt(rent)} <small>${t.cur}</small></b></div>
   <div class="roi-cell hot"><span>${t.roiRoi}</span><b class="num">${yp}%</b></div>
   <div class="roi-cell"><span>${t.roiPayback}</span><b class="num">${payback} <small>${t.roiYears}</small></b></div>
  </div>
  <div class="est-range">${t.roiRent} (5–8%): <span class="num">${fmt(r5)} – ${fmt(r8)}</span> · ${t.roi5yr}: <span class="num">${fmt(five)} ${t.cur}</span></div>
  <div class="est-arra"><span>${t.arraSale}:</span> <b class="num">${fmt(pps)} ${t.cur}/${t.sqft}</b></div></div>`;}
function setView(v){curView=v;document.querySelectorAll(".view").forEach(s=>s.classList.remove("show"));$("v-"+v).classList.add("show");
 document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.view===v||(v==="detail"&&n.dataset.view==="listings")));
 $("viewTitle").textContent=TR()["nav"+capit(v)];
 $("filterbar").style.display=(v==="assistant"||v==="detail"||v==="insights")?"none":"flex";
 if(v==="overview")renderOverview();if(v==="map"){renderMap();if(leafMap)setTimeout(()=>{leafMap.invalidateSize();},120);}if(v==="listings")renderListings();if(v==="trends")renderTrends();if(v==="studio")renderStudio();if(v==="detail")renderDetail();if(v==="insights")renderInsights();}
function setArea(ak){selArea=ak;$("area").value=ak;renderAll();}
function setType(tk){selType=tk;listType=tk;renderAll();}

document.querySelectorAll(".lang-switch button").forEach(b=>b.onclick=()=>build(b.dataset.lang));
document.querySelectorAll(".nav-item").forEach(n=>n.onclick=()=>setView(n.dataset.view));
$("area").onchange=e=>setArea(e.target.value);
$("type").onchange=e=>setType(e.target.value);
$("search").oninput=e=>{search=e.target.value;if(curView!=="listings")setView("listings");else renderListings();};
$("exportBtn").onclick=exportCSV;
$("printBtn").onclick=()=>window.print();
$("readAloud").onclick=function(){this.classList.add("on");speakNow($("aiText").textContent);setTimeout(()=>this.classList.remove("on"),1200);};
$("muteBtn").onclick=toggleMute;
document.querySelectorAll(".map-toggle button").forEach(b=>b.onclick=()=>{mapMode=b.dataset.mapmode;document.querySelectorAll(".map-toggle button").forEach(x=>x.classList.toggle("active",x.dataset.mapmode===mapMode));renderMap();if(mapMode!=="offline"&&leafMap)setTimeout(()=>{try{leafMap.invalidateSize();}catch(e){}},150);});
$("estBtn").onclick=estimateRent;
$("repBtn").onclick=generateReport;
$("roiBtn").onclick=calcROI;
$("roiBudget").addEventListener("keydown",e=>{if(e.key==="Enter")calcROI();});
["cmpA","cmpB","cmpC"].forEach(id=>$(id).addEventListener("change",renderComparison));
$("reportBg").onclick=e=>{if(e.target===$("reportBg"))closeReport();};
["estSize","estTarget"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")estimateRent();}));
$("micBtn").onclick=toggleMic;
$("sendBtn").onclick=()=>sendQuery($("asstInput").value);
$("asstInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendQuery($("asstInput").value);});
$("modalBg").onclick=e=>{if(e.target===$("modalBg"))closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeReport();}});
if(synth&&synth.getVoices().length===0){synth.onvoiceschanged=()=>{};}

build("ar");
</script>
